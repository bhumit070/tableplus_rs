# Builds Tabula for macOS, Linux and Windows and publishes a GitHub Release whenever Rust code
# changes on main. Version: vMAJOR.MINOR.PATCH, where MAJOR.MINOR come from
# Cargo.toml and PATCH counts up from the latest release of that series
# (bump Cargo.toml to 0.2.0 to start v0.2.x).

name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# One release at a time, so two pushes can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        name: Pick the next version
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([0-9]+)\.([0-9]+)\..*"/\1.\2/')
          # `|| true`: no tags yet for this series is fine (starts at .0).
          last=$(git tag --list "v${base}.*" | sed -E "s/^v${base}\.//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          patch=$(( ${last:--1} + 1 ))
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${base}.${patch}"

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: cargo test --locked

  build:
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    # One platform failing shouldn't hide the others' builds; the release
    # job publishes whatever was built and lists what's missing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-apple-silicon
          - os: macos-15
            target: x86_64-apple-darwin
            name: macos-intel
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libzstd-dev libdbus-1-dev libssl-dev libasound2-dev pkg-config clang cmake
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app=Tabula.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/tabula" "$app/Contents/MacOS/tabula"
          cp packaging/macos/Tabula.icns "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Tabula</string>
            <key>CFBundleDisplayName</key><string>Tabula</string>
            <key>CFBundleIdentifier</key><string>com.github.bhumit070.tabula</string>
            <key>CFBundleExecutable</key><string>tabula</string>
            <key>CFBundleIconFile</key><string>Tabula</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature: required to run on Apple Silicon. Not notarized,
          # so macOS blocks the first launch until it's allowed in Privacy & Security.
          codesign --force --deep --sign - "$app"
          # Disk image with an Applications shortcut to drag the app onto.
          mkdir dmg
          mv "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Tabula -srcfolder dmg -ov -format UDZO \
            "Tabula-${VERSION}-${{ matrix.name }}.dmg"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dir="Tabula-${VERSION}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/tabula" "$dir/"
          cp README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb --no-build --target ${{ matrix.target }} --deb-version "$VERSION" \
            -o "$dir.deb"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $name = "Tabula-$env:VERSION-${{ matrix.name }}"
          $exe = "target/${{ matrix.target }}/release/tabula.exe"
          Copy-Item $exe "$name.exe"
          # WiX 5: newer majors need a paid EULA acceptance.
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build packaging/windows/tabula.wxs -arch x64 `
            -d "Version=$env:VERSION" -d "Exe=$exe" -o "$name.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            Tabula-*.dmg
            Tabula-*.tar.gz
            Tabula-*.deb
            Tabula-*.exe
            Tabula-*.msi

  release:
    needs: [version, build]
    # Publish what built, even if one platform failed.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No platform built; nothing to release." >&2
            exit 1
          fi
          missing=""
          for p in macos-apple-silicon.dmg macos-intel.dmg linux-x86_64.deb \
                   linux-x86_64.tar.gz windows-x86_64.exe windows-x86_64.msi; do
            ls dist | grep -q -- "-$p\$" || missing="$missing $p"
          done
          notes="Builds for macOS (Apple Silicon, Intel), Linux (x86_64) and Windows (x86_64).

          - macOS (.dmg): open it and drag Tabula to Applications, or \`brew install --cask bhumit070/tap/tabula\`. Not notarized yet, so macOS blocks the first launch: open Tabula once, then System Settings → Privacy & Security → Open Anyway (or run \`xattr -dr com.apple.quarantine /Applications/Tabula.app\`).
          - Linux: on Debian/Ubuntu, use the apt repository (https://bhumit070.github.io/tableplus_rs/getting-started/) or \`sudo apt install ./Tabula-*.deb\`; elsewhere extract the .tar.gz and run \`./tabula\` (needs X11 or Wayland, Vulkan, and a Secret Service keyring such as GNOME Keyring for saved passwords).
          - Windows: the .msi installs Tabula with a Start menu entry; the .exe runs without installing. Neither is signed yet, so SmartScreen may ask the first time: More info → Run anyway."
          if [ -n "$missing" ]; then
            notes="$notes

          ⚠️ Not in this release (its build failed):$missing"
          fi
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Tabula $TAG" \
            --generate-notes \
            --notes "$notes"

  # Homebrew tap and apt repository (packages.yml).
  packages:
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

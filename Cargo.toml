[package]
name = "tabula"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "0.3.11" }
gpui-component = { version = "0.9.0", features = ["tree-sitter-sql", "tree-sitter"] }
gpui-kit-assets = "0.9"
json5 = "1.3.7"
keyring = { version = "4", features = ["v1"] }
mongodb = "3"
redis = { version = "0.32", features = ["tokio-comp", "aio"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "runtime_shaders"] }
plist = "1.10.3"
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
lsp-types = "0.97"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.11", features = ["test-support"] }

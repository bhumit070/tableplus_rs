[package]
name = "tabula"
version = "0.1.0"
edition = "2024"
description = "Database client for PostgreSQL, MySQL, SQL Server, SQLite, Redis and MongoDB"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "0.3.11" }
gpui-component = { version = "0.9.0", features = ["tree-sitter-sql", "tree-sitter"] }
gpui-kit-assets = "0.9"
json5 = "1.3.7"
keyring = { version = "4", features = ["v1"] }
mongodb = "3"
redis = { version = "0.32", features = ["tokio-comp", "aio", "connection-manager"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
plist = "1.10.3"
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
lsp-types = "0.97"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1.2.3"
tokio-util = { version = "0.7.20", features = ["compat"] }
# SQL Server (sqlx dropped its MSSQL driver). rustls, like the other drivers.
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono"] }

[dev-dependencies]
# The MCP tests talk to the server over HTTP like an AI tool does.
rmcp = { version = "3.9", features = ["client", "transport-streamable-http-client-reqwest"] }
csv = "1.4.0"
rand = { version = "0.10", features = ["thread_rng"] }
gpui = { package = "gpui-pre", version = "0.3.11", features = ["test-support"] }
# Offscreen screenshots (src/ui/app/shots.rs).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target."cfg(target_os = \"macos\")".dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.11" }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# `cargo deb` (used by the release workflow) builds the Linux .deb.
[package.metadata.deb]
maintainer = "bhumit070 <ganatrabhoomit070@gmail.com>"
copyright = "bhumit070"
section = "database"
extended-description = "A fast native database client with no connection limit."
# Vulkan is loaded at runtime, so the automatic scan doesn't find it.
depends = "$auto, libvulkan1"
recommends = "gnome-keyring"
assets = [
    ["target/release/tabula", "usr/bin/", "755"],
    ["packaging/linux/tabula.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/tabula.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/linux/tabula.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
